
name: Generate Global20Engine Macro Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 2 * *"

permissions:
  contents: write

jobs:
  generate-macro-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate macro pack outside Streamlit
        run: python g20_macro_fetcher.py

      - name: Show generated files
        run: |
          echo "Repository root:"
          pwd
          echo "Generated macro_pack_latest contents:"
          ls -la macro_pack_latest || true


      - name: Commit generated macro pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add -A macro_pack_latest
          git status --short

          if git diff --cached --quiet; then
            echo "No generated macro pack changes to commit"
            exit 0
          fi

          git commit -m "Update Global20Engine macro pack"

          git pull --rebase origin main
          git push origin HEAD:main
