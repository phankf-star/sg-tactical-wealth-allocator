
name: Generate Global20Engine Macro Packnameatest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate macro pack outside Streamlit
        run: python g20_macro_fetcher.py

      - name: Commit generated macro pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_pack_latest/*.csv macro_pack_latest/*.xlsx macro_pack_latest/*.zip
          git commit -m "Update Global20Engine macro pack" || echo "No changes to commit"
          git push
``

on:
  workflow_dispatch:
  schedule:
    # Runs monthly on the 2nd day at 01:00 UTC.
    # Adjust if your preferred monthly data-release window differs.
    - cron: "0 1 2 * *"

permissions:
  contents: write

jobs:
  generate-macro-pack:
