
name: Generate Global20Engine Macro Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: write

concurrency:
  group: generate-global20engine-macro-pack-main
  cancel-in-progress: true

jobs:
  generate-macro-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Lab test macro adapters
        run: |
          python macro_adapter_lab.py
          
      
      - name: Generate macro pack outside Streamlit
        run: |
          python g20_macro_fetcher.py

      - name: Lab test rates history 252D
        run: |
          python rates_history_lab_test.py

      - name: Lab check macro pack
        run: |
          python Lab_check_macro_pack.py

      - name: Show generated files
        run: |
          find macro_pack_latest -maxdepth 1 -type f -print
          echo "---- macro_data.csv ----"
          cat macro_pack_latest/macro_data.csv || true
          echo "---- diagnostics.csv ----"
          cat macro_pack_latest/diagnostics.csv || true

    
      - name: Commit generated macro pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git pull --rebase origin main

          git add -A macro_pack_latest

          git status --short

          if git diff --cached --quiet; then
            echo "No macro pack changes to commit"
          else
            git commit -m "Update Global20Engine macro pack"
            git push
          fi
