name: Test Global Macro Regime Strict PMI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/update_global_macro_regime.py"
      - "tools/test_global_macro_regime_strict_pmi.py"
      - ".github/workflows/test_global_macro_regime_strict_pmi.yml"

permissions:
  contents: read

jobs:
  test-global-macro-regime-strict-pmi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run strict PMI tests
        run: |
          python tools/test_global_macro_regime_strict_pmi.py
