
name: Patch Streamlit App UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run app UI patch
        run: python tools/patch_app_ui.py
      
      - name: Show git diff
        run: git diff -- "sg_tactical_wealth_allocator.py"

      - name: Commit patched app file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add "sg_tactical_wealth_allocator.py"
            git commit -m "Patch app UI macro mini chart axis and index chart wording"
            git push
          fi
