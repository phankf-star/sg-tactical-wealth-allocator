
name: Apply Base App Data-Source Governance Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-base-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply base app data-source governance patch
        run: |
          python patch_base_app_data_source_governance.py sg_tactical_wealth_allocator.py

      - name: Verify base app data-source governance
        run: |
          python verify_base_app_data_source_governance.py sg_tactical_wealth_allocator.py

      - name: Commit patched base app
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sg_tactical_wealth_allocator.py sg_tactical_wealth_allocator.py.bak_data_source_governance
          git commit -m "Apply base app data-source governance patch" || echo "No changes to commit"
          git push
