name: Macro Adapter Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-adapter-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 lxml openpyxl yfinance

      - name: Run macro adapter diagnostics only
        run: |
          python tools/macro_adapter_lab.py
