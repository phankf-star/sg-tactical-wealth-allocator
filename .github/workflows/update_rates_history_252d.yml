name: Update Rates History 252D

on:
  schedule:
    # Weekly rates/yields history refresh.
    # Keep this separate from monthly macro pack to reduce monthly workflow runtime.
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates-history-252d:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 lxml openpyxl yfinance

      - name: Generate US / HK / MY / SG / JP rates history
        run: |
          python tools/update_rates_history_252d.py

      - name: Commit updated rates history outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates_history/ || true
          git add macro_pack_latest/rates_history/ || true
          git add *_rates*_daily.csv || true
          git add *_yield*_daily.csv || true
          git diff --cached --quiet || git commit -m "Auto-update 252D rates history"
          git push
